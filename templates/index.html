<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛探險的小帕 - AI 多模態互動繪本</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="game-container">
        <div id="cover-page">
            <video id="cover-bg-video" autoplay loop muted playsinline><source src="/static/videos/cover_forest.mp4" type="video/mp4"></video>
            <div class="overlay-dark"></div>
            <div class="cover-content">
                <h1 class="cover-title"><i class="bi bi-music-note-beamed"></i> 愛探險的小帕</h1>
                <p class="cover-subtitle">AI 多模態互動魔法繪本</p>
                <button type="button" id="start-btn" class="btn btn-warning btn-lg rounded-pill px-5 py-3 fs-2 fw-bold shadow-lg">開始大冒險</button>
            </div>
        </div>

        <div id="end-page">
            <video id="end-bg-video" loop muted playsinline><source src="/static/videos/scene15_sing.mp4" type="video/mp4"></video>
            <div id="end-overlay"></div>
            <div class="end-content">
                <h1 class="end-title">大冒險成功！</h1>
                <h2 class="end-subtitle">小帕在你的幫助下，完成了最完美的音樂會！</h2>
                <button type="button" class="btn btn-magical" onclick="location.reload()"><i class="bi bi-arrow-clockwise me-2"></i> 再玩一次</button>
            </div>
        </div>

        <audio id="bgm" src="/static/audio/bgm.mp3" loop></audio>
        <video id="bg-video" loop muted playsinline></video>
        <img id="camera-box" src="{{ url_for('video_feed') }}">
        <canvas id="drawing-canvas"></canvas>
        <img id="user-artwork">
        
        <button type="button" id="finish-draw-btn" class="btn btn-success btn-lg rounded-pill px-5 py-3 fs-3 fw-bold">✨ 我畫好了！</button>
        <button type="button" id="next-chapter-btn" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fs-3 fw-bold">下一關 👉</button>
        <div id="voice-indicator"><i class="bi bi-mic-fill"></i> 請大喊！</div>

        <div id="ui-panel">
            <div class="card card-custom" id="story-card">
                <h2 class="text-success fw-bold mb-3 fs-1" id="story-title">載入中...</h2>
                <p class="text-dark fs-3 mb-0" id="story-text">請稍候，小帕正在準備行李...</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
